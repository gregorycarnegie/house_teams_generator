[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos = { version = "0.8.19", features = ["csr"] }
wasm-bindgen = "0.2.121"
wasm-bindgen-futures = "0.4.71"
js-sys = "0.3.98"
common = { path = "../common" }

[dependencies.web-sys]
version = "0.3.98"
features = [
  "File",
  "FileList",
  "FileReader",
  "Blob",
  "BlobPropertyBag",
  "Url",
  "HtmlAnchorElement",
  "HtmlInputElement",
  "DragEvent",
  "DataTransfer",
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "Event",
  "InputEvent",
]
